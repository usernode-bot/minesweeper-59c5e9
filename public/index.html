<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name + ': ' + v.message));
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name + ': ' + val.message);
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Minesweeper</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%237c3aed'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <!-- Built from the design kit in styles/tailwind-input.css: colour tokens
       that are right in both looks, and components for buttons, fields,
       lists, cards and data states. The real app keeps the kit; CLAUDE.md's
       "## Design" says how. -->
  <!-- usernode-spec-screens@1: the screens the spec drew, carried over by the platform as this
       first version's starting point. Their styles are in public/screens.css.
       Change them where behaviour needs it; do not redraw them. -->
  <div data-spec-screen="1">
    <div class="app">
    <div class="top"><h1 class="title">Minesweeper</h1><button class="btn-secondary" data-new-game type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>New game</button></div>
    <p class="mt-1 px-1 text-small text-muted" data-usernode-demo-note hidden>Staging demo</p>
    <div class="size"><p class="section-label">Board size</p><div class="seg" data-size-picker role="group" aria-label="Board size"><button class="on" data-size="small" type="button">Small <small>8×8</small></button><button data-size="medium" type="button">Medium <small>8×12</small></button><button data-size="large" type="button">Large <small>8×16</small></button></div></div>
    <div class="stats"><div class="stat"><small>Mines left</small><b data-mines-left></b></div><div class="stat"><small>Time</small><b data-time></b></div><div class="stat"><small>Best</small><b data-best><span class="skeleton inline-block h-5 w-14 align-middle"></span></b></div></div>
    <div class="board" data-board role="group" aria-label="Minefield"></div>
    <div class="status" data-status><span class="dot" data-status-dot></span><span data-status-text></span></div>
    <div class="mode seg" data-mode role="group" aria-label="Tap action">
      <button class="btn-primary" data-mode-reveal type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4l7 17 2-7 7-2z"/></svg>Reveal</button>
      <button data-mode-flag type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V4"/><path d="M6 4h12l-3 4 3 4H6"/></svg>Flag</button>
      <button class="btn-primary" data-play-again type="button" hidden>Play again</button>
    </div>
    <div class="mt-3 flex items-center justify-between gap-3 px-1 text-small text-muted" data-save-note hidden>
      <span>Couldn't save this time.</span><button class="btn-secondary" data-save-retry type="button">Retry</button>
    </div>
    <div class="recent"><p class="section-label">Your boards</p>
    <ul class="list" data-list hidden></ul>
    <ul class="list" data-list-loading aria-hidden="true">
      <li class="list-row"><span class="skeleton h-9 w-9 shrink-0 rounded-full"></span><div class="flex-1"><div class="skeleton h-4 w-32"></div><div class="mt-2 skeleton h-3 w-24"></div></div><span class="skeleton h-4 w-12"></span></li>
      <li class="list-row"><span class="skeleton h-9 w-9 shrink-0 rounded-full"></span><div class="flex-1"><div class="skeleton h-4 w-28"></div><div class="mt-2 skeleton h-3 w-24"></div></div><span class="skeleton h-4 w-12"></span></li>
      <li class="list-row"><span class="skeleton h-9 w-9 shrink-0 rounded-full"></span><div class="flex-1"><div class="skeleton h-4 w-32"></div><div class="mt-2 skeleton h-3 w-20"></div></div><span class="skeleton h-4 w-12"></span></li>
    </ul>
    <div class="state-empty" data-list-empty hidden>
      <p class="text-body font-medium">No boards yet.</p>
      <p class="text-small text-muted">Finish a game and its time shows here.</p>
    </div>
    <div class="state-error" data-list-error hidden>
      <p class="text-body font-medium">Couldn't load your boards.</p>
      <p class="text-small text-muted">The board still works. Check your connection, then try again.</p>
      <button class="btn-secondary mt-2" data-list-retry type="button">Retry</button>
    </div>
    <button class="btn-secondary mt-3 w-full" data-show-more type="button" hidden>Show more</button>
    </div>
    </div>
  </div>
  <!-- /usernode-spec-screens@1 -->
  <script src="/app.js" defer></script>
</body>
</html>
